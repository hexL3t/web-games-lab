<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>

    <!-- Meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <div class="container">

      <!-- Header -->
      <header>
        <h1 class="title">🐍 SNAKE</h1>
        <p class="subtitle">Use arrow keys to move. Eat the food. Don't hit the walls.</p>
      </header>

      <!-- Game -->
      <div class="wrapper">
        <div class="game-details">
          <span class="score">Score: 0</span>
          <span class="high-score">High Score: 0</span>
        </div>
        <div class="play-board"></div>
      </div>

      <!-- Footer -->
      <footer>
        <p class="instructions">Press any <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> arrow key to start</p>
      </footer>

    </div>

    <!-- Script -->
    <script src="main.js" defer></script>

  </body>
</html>
